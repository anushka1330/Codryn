<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="codryn-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#3b82f6" flood-opacity="0.4" />
    </filter>
  </defs>
  <!-- Sleek background tile for crisp contrast in both dark & light browser tabs -->
  <rect width="64" height="64" rx="14" fill="#0a0b0e" stroke="#1e293b" stroke-width="1.5" />
  
  <!-- Cat Body Silhouette Outline -->
  <path 
    d="M 17 13
       C 24 17, 40 17, 47 13
       C 47 18, 46 22, 49 26
       C 53 32, 53 39, 47 44
       C 45 47, 44 50, 44 53
       C 39 53, 38 43, 32 43
       C 26 43, 25 53, 20 53
       C 20 50, 19 47, 17 44
       C 11 39, 11 32, 15 26
       C 18 22, 17 18, 17 13 Z"
    stroke="url(#codryn-blue)" 
    stroke-width="3.5" 
    stroke-linecap="round" 
    stroke-linejoin="round"
    filter="url(#glow)"
  />

  <!-- Cat Tail on lower left -->
  <path 
    d="M 19 43
       C 14 44, 10 42, 8 35"
    stroke="url(#codryn-blue)" 
    stroke-width="3.5" 
    stroke-linecap="round" 
    stroke-linejoin="round"
    filter="url(#glow)"
  />
</svg>